{% extends "base.html" %}
{% block title %}Set New Password - Axion Voting{% endblock %}
{% block content %}
<div class="auth-page"><div class="auth-card">
  <div class="auth-header"><div class="auth-icon">🔑</div><h1>Set New Password</h1><p>Create a new password for your account.</p></div>
  <form method="POST" action="{{ url_for('reset_password', token=token) }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-group"><label for="password" class="form-label">New Password</label><input class="form-input" type="password" id="password" name="password" minlength="6" autocomplete="new-password" required></div>
    <div class="form-group"><label for="confirm_password" class="form-label">Confirm New Password</label><input class="form-input" type="password" id="confirm_password" name="confirm_password" minlength="6" autocomplete="new-password" required></div>
    <button class="btn btn-primary btn-full" type="submit">Update Password</button>
  </form>
</div></div>
{% endblock %}
