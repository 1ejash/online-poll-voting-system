{% extends "base.html" %}

{% block title %}Admin Login - Online Poll{% endblock %}

{% block nav %}
<a href="/">Home</a>
<a href="/user-login">User Login</a>
{% endblock %}

{% block content %}

<div class="card form-card">

    <div class="form-title">
        <div class="icon">👨‍💼</div>
        <h1>Admin Login</h1>
        <p>Login to manage the polling system</p>
    </div>

    {% if error %}
    <div class="message message-error">{{ error }}</div>
    {% endif %}

    <form method="POST">

        <div class="form-group">
            <label for="email">Admin Email</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter admin email"
                required
            >
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter admin password"
                required
            >
        </div>

        <button type="submit" class="btn btn-admin full-width">
            🔐 Admin Login
        </button>

    </form>

    <div class="small-link">
        Are you a user?
        <a href="/user-login">User Login</a>
    </div>

</div>

{% endblock %}
